[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "spine-degeneration-classifier"
version = "1.0.0"
description = "Two-Stage Lumbar Spine Degenerative Classification using Ultralytics YOLO11 and 2.5D Volumetric CNNs (RSNA 2024)"
readme = "README.md"
license = { text = "MIT" }
authors = [
    { name = "Sentientbee" }
]
requires-python = ">=3.10"
dependencies = [
    "torch>=2.0.0",
    "torchvision>=0.15.0",
    "ultralytics>=8.3.0",
    "pydicom>=2.4.0",
    "opencv-python>=4.8.0",
    "numpy>=1.24.0",
    "pandas>=2.0.0",
    "matplotlib>=3.7.0",
    "python-dotenv>=1.0.0",
    "tqdm>=4.65.0",
]

[project.optional-dependencies]
demo = [
    "streamlit>=1.30.0",
    "plotly>=5.15.0",
]
dev = [
    "pytest>=7.0.0",
    "black>=23.0.0",
    "flake8>=6.0.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]
